[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "shikumi-contrace"
version = "0.1.0"
description = "Describe the contract of a type as a standalone asset, and trace which tests relate to which clause."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "minoru_jp" }]
dependencies = ["shikumi>=0.2.4", "metamk>=0.1.0"]

keywords = [
  "test",
  "testing",
  "contract",
  "design-by-contract",
  "precondition",
  "postcondition",
  "invariant",
  "traceability",
  "pytest",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]

[project.optional-dependencies]
pytest = ["pytest>=8.0", "pytest-xdist>=3.5"]
test = ["pytest>=8.0", "pytest-xdist>=3.5"]
lint = ["ruff==0.16.10"]
typecheck = ["basedpyright==1.40.2", "mypy>=1.10"]
docs = ["shikumi-devdoc>=0.3.5"]
dist = ["build>=1.2", "twine>=6.1"]

[project.urls]
Repository = "https://github.com/minoru-jp/shikumi-contrace"
Issues = "https://github.com/minoru-jp/shikumi-contrace/issues"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
preview = false

[tool.hatch.build.targets.wheel]
packages = ["src/shikumi_contrace"]

[tool.hatch.build.targets.sdist]
exclude = ["/.github"]

[tool.basedpyright]
include = ["src/shikumi_contrace"]
pythonVersion = "3.11"
