name: Publish release

# Publishing a GitHub Release runs the same checks as CI, verifies that the tag
# is v<project version>, builds and verifies the distributions, and only then
# publishes them to PyPI through Trusted Publishing (no API token is stored).
on:
  release:
    types: [published]

permissions:
  contents: read

# Never publish the same release twice at the same time; do not cancel a
# publication that is already in progress.
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  checks:
    name: Quality and tests
    uses: ./.github/workflows/checks.yml

  build:
    name: Build release distributions
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dist]"

      # The tag name is passed through the environment, never interpolated into
      # the script, so a crafted tag name cannot inject shell code.
      - name: Verify tag, build and verify distributions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/check_dist.py --release-tag "$RELEASE_TAG"

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/shikumi-contrace
    permissions:
      id-token: write # required for Trusted Publishing

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
